[project]
name = "kopi"
version = "1.2.7"
description = "KOPI (Keep Our Projects In-sync): manage GitHub Projects (v2) and keep them in step with CHANGELOG.md, TODO.md, issues and PRs"
requires-python = ">=3.9"
license = { file = "LICENSE.md" }
dependencies = []

[project.scripts]
kopi = "kopi:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["kopi"]
