[project]
name = "kopi"
version = "0.5.8"
description = "Create and manage GitHub Projects (v2) from the command line"
requires-python = ">=3.9"
license = { file = "LICENSE.md" }
dependencies = []

[project.scripts]
kopi = "kopi:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["kopi"]
